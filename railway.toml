# Railway config-as-code for offdutylocks.com.
# Reference: https://docs.railway.com/reference/config-as-code
#
# Railway's ONE job is to serve the public site. `railway.toml` is the DEFAULT
# config every service in the project reads unless it is explicitly pointed at
# another file, so the default MUST be the web server: that way the service that
# owns the offdutylocks.com domain serves HTTP no matter how it is wired up in
# the dashboard. A missing/forgotten override then fails *safe* (it serves the
# site) instead of silently running a non-HTTP job and returning 502.
#
# Scheduling (owner decision 2026-08-04): the betting scrape runs on Railway
# again — as the SEPARATE `betting-cron` service pinned to railway.scrape.json,
# never via this default file (that inheritance is what caused the 502
# incident above). Team stats publish daily from GitHub Actions
# (.github/workflows/extract.yml, ESPN source); scrape.yml remains as a
# dispatch-only manual backup. See docs/deployment.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Production WSGI server for the read-only Flask app. The bind port is NOT on
# the command line on purpose: Railway runs the start command without shell
# interpolation, so a literal "$PORT" here would reach gunicorn unexpanded and
# fail with "'$PORT' is not a valid port number". gunicorn.conf.py reads
# os.environ["PORT"] in Python instead (falling back to 3000), which is
# shell-independent and always valid. That fallback MUST match the target port
# set on the domain under Settings -> Networking (currently 3000): the
# healthcheck auto-detects whatever port is listening and passes regardless,
# but the domain routes only to its configured target port, so a mismatch gives
# a deploy that reports "Healthcheck succeeded" and still serves 502 with
# x-railway-fallback: true. That same config also binds [::] rather
# than 0.0.0.0 where the platform supports it: Railway's private network (which
# the public edge routes over) is IPv6-only, so an IPv4-only listener passes the
# healthcheck and still serves 502 + x-railway-fallback on the domain.
# DATABASE_URL is injected via a reference
# variable: DATABASE_URL = ${{Postgres.DATABASE_URL}}
startCommand = "gunicorn --config /app/gunicorn.conf.py wnba_pipeline.web:app"

# Railway probes this until it returns 200 before routing traffic; the web app
# answers /healthz (a static "ok", no DB touch) even when the database is empty.
healthcheckPath = "/healthz"
healthcheckTimeout = 100

# Keep the site up: restart the web process if it ever exits.
restartPolicyType = "ON_FAILURE"
