# Railway config-as-code for offdutylocks.com.
# Reference: https://docs.railway.com/reference/config-as-code
#
# Railway's ONE job is to serve the public site. `railway.toml` is the DEFAULT
# config every service in the project reads unless it is explicitly pointed at
# another file, so the default MUST be the web server: that way the service that
# owns the offdutylocks.com domain serves HTTP no matter how it is wired up in
# the dashboard. A missing/forgotten override then fails *safe* (it serves the
# site) instead of silently running a non-HTTP job and returning 502.
#
# The scrapers do NOT run on Railway anymore. They run on GitHub Actions
# (.github/workflows/scrape.yml), which publishes betting_games + team_stats to
# this same Postgres via the DATABASE_URL secret. See docs/deployment.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Production WSGI server for the read-only Flask app. Binds Railway's injected
# $PORT so the edge can route to it (no listener on the probed port == the
# x-railway-fallback 502 / healthcheck failure). ${PORT:-8080} falls back to
# 8080 if PORT is not injected, which is also Railway's default target port, so
# the bind is always valid. DATABASE_URL is injected via a reference variable:
#   DATABASE_URL = ${{Postgres.DATABASE_URL}}
startCommand = "gunicorn wnba_pipeline.web:app -b 0.0.0.0:${PORT:-8080} --workers 2 --timeout 60"

# Railway probes this until it returns 200 before routing traffic; the web app
# answers /healthz (a static "ok", no DB touch) even when the database is empty.
healthcheckPath = "/healthz"
healthcheckTimeout = 100

# Keep the site up: restart the web process if it ever exits.
restartPolicyType = "ON_FAILURE"
