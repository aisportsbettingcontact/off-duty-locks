name: Data Audit

# Deep audit of the rows the site actually serves, and — only when explicitly
# asked — repair of a split proven to be a duplicate.
#
# This is separate from the per-run validation inside the pipeline. That
# inspects one snapshot before it is written and cannot see a fault that exists
# only BETWEEN rows. The `ytd` split holding Last-7 numbers is exactly such a
# fault: every individual run reported PASSED while the published data was
# mislabelled.
#
# `repair` defaults to a dry run. Even with apply=true it can only delete a
# split it first proves is numerically identical to another for every shared
# team, so distinct, legitimate data cannot be destroyed by this workflow.
#
# Scheduled daily in-season so production is actually observed — dispatch-only
# meant the one check able to catch the ytd=last7 mislabel never ran against
# prod. Scheduled runs observe and report ONLY: `repair`/`apply` are
# workflow_dispatch inputs, empty on a schedule event, so no repair step can
# run. A failing audit files a pipeline-alert issue and goes red; it gates
# nothing else.
#
# GitHub auto-disables scheduled workflows after 60 days without repository
# activity (the same trap extract.yml documents): a commit-quiet offseason
# would silently kill this audit. If it goes quiet, check Actions → Data
# Audit for the "disabled" banner and re-enable it.
#
# DATABASE_URL is consumed but never printed.

on:
  schedule:
    # 11:15 UTC daily, May–October only: after the ~10:30 scrape tick, so the
    # audit sees the freshest published rows, and offset from the :00/:30
    # scrape schedule so it never races a tick that is mid-write. Offseason
    # months never trigger.
    - cron: "15 11 * 5-10 *"
  workflow_dispatch:
    inputs:
      repair:
        description: "Also run repair-data for the duplicated split"
        type: boolean
        required: false
        default: false
      apply:
        description: "Actually delete (repair runs dry unless this is true)"
        type: boolean
        required: false
        default: false
      remove_split:
        description: "Split to remove if proven duplicate"
        required: false
        default: "ytd"
      against:
        description: "Split it must be identical to for removal"
        required: false
        default: "last7"
      repair_odds:
        description: "Also run repair-odds (NULL impossible stored moneylines)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write     # file a pipeline-alert issue when the audit fails

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        # --no-build-isolation: PEP 517 build isolation would download an
        # un-pinned setuptools; setup-python already ships one.
        run: python -m pip install --upgrade pip -q && pip install --require-hashes -r requirements.lock -q && pip install -e . --no-deps --no-build-isolation -q

      - name: Guard — DATABASE_URL must be set
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set"; exit 1
          fi

      - name: "Validate — before"
        id: before
        run: |
          set -uo pipefail
          set +e
          wnba-pipeline validate-data --season 2026 | tee /tmp/before.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          {
            echo "## Validation — before"
            echo ""
            echo '```'
            cat /tmp/before.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Repair — remove the duplicated split"
        if: ${{ inputs.repair }}
        id: repair
        run: |
          set -uo pipefail
          ARGS="--remove-split ${{ inputs.remove_split }} --against ${{ inputs.against }}"
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="$ARGS --yes"; fi
          echo "running: wnba-pipeline repair-data $ARGS"
          set +e
          wnba-pipeline repair-data $ARGS | tee /tmp/repair.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          {
            echo ""
            echo "## Repair"
            echo ""
            echo '```'
            cat /tmp/repair.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Repair — NULL impossible stored moneylines"
        if: ${{ inputs.repair_odds }}
        id: repair_odds
        run: |
          set -uo pipefail
          ARGS=""
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="--yes"; fi
          echo "running: wnba-pipeline repair-odds $ARGS"
          set +e
          wnba-pipeline repair-odds $ARGS | tee /tmp/repair-odds.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          {
            echo ""
            echo "## Repair — odds"
            echo ""
            echo '```'
            cat /tmp/repair-odds.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Validate — after"
        if: ${{ (inputs.repair || inputs.repair_odds) && inputs.apply }}
        run: |
          set -uo pipefail
          set +e
          wnba-pipeline validate-data --season 2026 | tee /tmp/after.txt
          set -e
          {
            echo ""
            echo "## Validation — after"
            echo ""
            echo '```'
            cat /tmp/after.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report
        if: always()
        run: |
          echo "validate(before) exit : ${{ steps.before.outputs.exit_code }}"
          echo "repair exit           : ${{ steps.repair.outputs.exit_code || 'not run' }}"
          echo "(exit 4 from validate = the serving tables are inconsistent)"

      - name: Alert on audit failure
        # Same file-or-comment pattern as extract.yml: one open pipeline-alert
        # issue collects every alert. /tmp/before.txt is validate-data's stdout
        # report only — DATABASE_URL is never printed there.
        #
        # The gate fires on ANY nonzero exit, and the classes mean different
        # things: 4 = the audit RAN and the serving tables are inconsistent;
        # anything else (2 = config error such as an unreachable database)
        # means the audit COULD NOT RUN and proved nothing about the data.
        # The title/body must say which, or a dead DATABASE_URL reads as a
        # data corruption incident.
        #
        # failure() is load-bearing: with no status function GitHub implies
        # success(), so a job that died at checkout, on a --require-hashes
        # break, or on a rotated DATABASE_URL filed NO alert at all. extract.yml
        # documents and fixes this same regression; this workflow was the one
        # left broken, and it is the only check that reads production data.
        if: ${{ failure() || steps.before.outputs.exit_code != '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try { report = fs.readFileSync('/tmp/before.txt','utf8'); } catch (e) {}
            const code = '${{ steps.before.outputs.exit_code }}';
            const ranAndFailed = code === '4';
            const title = ranAndFailed
              ? 'pipeline-alert: data audit found inconsistent serving tables'
              : `pipeline-alert: data audit could not run (validate-data exit ${code})`;
            const explanation = ranAndFailed
              ? `Full-scope \`validate-data\` failed with exit code **${code}** — the audit ran and the serving tables are inconsistent.`
              : `Full-scope \`validate-data\` exited **${code}** before auditing (2 = config error, e.g. the database was unreachable) — the data was NOT audited, so this says nothing about its consistency.`;
            const body = [
              explanation,
              '', '```', report, '```',
              '', 'See docs/runbook.md for triage. Repair runs only via workflow_dispatch (dry by default).'
            ].join('\n');
            const alert = require('./.github/scripts/pipeline-alert.js');
            await alert({github, context}, {key: 'data-audit', title, body});

      - name: Resolve the alert on a clean audit
        if: ${{ success() && steps.before.outputs.exit_code == '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            const alert = require('./.github/scripts/pipeline-alert.js');
            await alert({github, context}, {key: 'data-audit', resolved: true});

      - name: Fail the run on audit failure
        # Honest gate (repo law 3): inconsistent serving tables must show a red
        # run, not a green run with findings buried in the summary. MUST stay
        # after the alert step so both fire. Observation only — this workflow
        # gates nothing else.
        if: ${{ steps.before.outputs.exit_code != '0' }}
        run: |
          CODE="${{ steps.before.outputs.exit_code }}"
          if [ "$CODE" = "4" ]; then
            echo "::error::validate-data exited 4 — the serving tables are inconsistent. See the summary and the pipeline-alert issue."
          else
            echo "::error::validate-data exited $CODE — the audit could not run (2 = config error, e.g. unreachable database). See the summary and the pipeline-alert issue."
          fi
          exit 1
