name: Scrape + Publish (DB)

# MANUAL BACKUP publish path for the betting slate (workflow_dispatch only).
#
# The scheduled 30-minute betting scrape does NOT run here anymore — the
# `schedule:` trigger is retired (owner-authorized, 2026-08-04). GitHub
# delivers `schedule` best-effort, and measured gaps between ticks ran 30
# minutes to 3.5 hours: cadence dilution the line-history snapshots and the
# dashboard's data-driven refresh cannot absorb (an interim :07/:37 offset off
# GitHub's congested marks did not change the guarantee — still best-effort).
# The scheduler is now a dedicated Railway cron service with the EXPLICIT file
# `railway.scrape.json` (cron `*/30 * * * *`, startCommand
# `wnba-pipeline betting-cron`, restartPolicyType NEVER), running on Railway's
# private network next to Postgres. One scheduler by design: two would
# double-write the same rows (the COALESCE upsert makes the race benign, not
# desirable).
#
# Why an explicit config file and NOT railway.toml: the ORIGINAL Railway
# betting cron (pre-ab09843, 2026-07-29) died because railway.toml's DEFAULT
# start command launched the cron, the web service inherited it, nothing bound
# $PORT, and the whole site 502'd. The fix made railway.toml fail-safe — the
# default every service inherits is "serve the site". That asymmetry is law:
# a service that forgets its config override must end up serving the site
# (harmless), never running a cron. The cron service is therefore explicitly
# pinned to railway.scrape.json in its service settings; railway.toml stays
# untouched.
#
# This workflow remains the manual backup when Railway is down or a
# publish must be forced immediately. It runs OUTSIDE Railway's private
# network, so DATABASE_URL must be the PUBLIC proxy URL (*.proxy.rlwy.net) —
# the guard below enforces that.
#
#   - betting: VSIN + Action Network are datacenter-reachable, so the live
#     betting slate publishes fine from a GitHub-hosted runner.
#   - team-stats: stats.wnba.com (Akamai) blocks datacenter IPs, so a LIVE
#     team-stats scrape cannot run here. Until a residential/self-hosted runner
#     is available, team_stats is seeded from the committed fixture on demand
#     (workflow_dispatch) so the table stays populated. See docs/deployment.md.

on:
  workflow_dispatch:
    inputs:
      seed_team_stats:
        description: "Also seed team_stats from the committed fixture"
        type: boolean
        required: false
        default: false

# Never let two dispatched runs overlap (both write the same rows).
concurrency:
  group: wnba-scrape-publish
  cancel-in-progress: false

permissions:
  contents: read
  issues: write     # file a pipeline-alert issue on failure

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Disable switch: set repository variable PIPELINE_ENABLED=false to pause.
    if: ${{ vars.PIPELINE_ENABLED != 'false' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        # --no-build-isolation: PEP 517 build isolation would download an
        # un-pinned setuptools; setup-python already ships one.
        run: python -m pip install --upgrade pip && pip install --require-hashes -r requirements.lock && pip install -e . --no-deps --no-build-isolation

      - name: Guard — DATABASE_URL must be set
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set. Add the PUBLIC Railway Postgres URL as a repo secret."
            exit 1
          fi
          # Publishing needs the public URL; the internal host is unreachable here.
          case "$DATABASE_URL" in
            *railway.internal*)
              echo "::error::DATABASE_URL points at the INTERNAL Railway host, unreachable from GitHub. Use DATABASE_PUBLIC_URL (*.proxy.rlwy.net)."
              exit 1;;
          esac

      - name: Ensure serving schema
        run: wnba-pipeline db-init

      - name: Publish betting (live — VSIN + Action Network)
        id: betting
        run: |
          set -uo pipefail
          set +e
          wnba-pipeline betting > betting_manifest.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat betting_manifest.json

      - name: Seed team_stats from fixture (on demand)
        if: ${{ inputs.seed_team_stats }}
        run: |
          wnba-pipeline run-team-stats \
            --fixture fixtures/sanitized/leaguedashteamstats_2026_lastn7.json \
            --data-root "${RUNNER_TEMP}/seed"

      # Audit what is actually in the serving tables, after publishing. This is
      # a different question from the per-run validation the pipeline already
      # does: that inspects one snapshot before it is written and cannot see a
      # fault that only exists BETWEEN rows — most importantly two splits
      # derived from the same source, which is how `ytd` came to hold Last-7
      # numbers while every individual run reported PASSED.
      # Gate the run on what THIS run can affect: the betting tables. Team
      # stats cannot be refreshed from a datacenter runner (Akamai blocks it),
      # so their freshness/consistency findings must not fail every 30-minute
      # betting scrape — the full validation still prints in the summary below
      # and still gates the paths that actually write team stats.
      - name: Validate the serving tables (betting scope gates this run)
        id: validate
        run: |
          set -uo pipefail
          set +e
          wnba-pipeline validate-data --season 2026 --scope betting
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Surface validation findings in the summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## Data validation"
            echo ""
            echo '```'
            wnba-pipeline validate-data --season 2026 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run summary
        if: always()
        run: |
          {
            echo "## Scrape + publish"
            echo ""
            echo "**betting exit code:** \`${{ steps.betting.outputs.exit_code }}\`"
            echo ""
            echo '```json'
            cat betting_manifest.json 2>/dev/null || echo "(no manifest)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if betting did not succeed
        if: ${{ steps.betting.outputs.exit_code != '0' }}
        run: |
          echo "::error::betting publish exited ${{ steps.betting.outputs.exit_code }} (0=ok, 3=upstream, 6=storage). See summary."
          exit 1

      - name: Fail if the serving tables are internally inconsistent
        if: ${{ steps.validate.outputs.exit_code != '0' }}
        run: |
          echo "::error::validate-data exited ${{ steps.validate.outputs.exit_code }} — the site would publish inconsistent data. See the Data validation section of the summary."
          exit 1

      - name: Alert on failure
        # A red run nobody sees is as silent as a green one — a 14-run/27h red
        # streak went unnoticed here. Same file-or-comment pattern as
        # extract.yml: one open pipeline-alert issue collects every alert.
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const betting = '${{ steps.betting.outputs.exit_code }}' || '(step did not run)';
            const validate = '${{ steps.validate.outputs.exit_code }}' || '(step did not run)';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'pipeline-alert: scrape + publish failed';
            const body = [
              `[Scrape + publish run](${run}) failed.`,
              '',
              `- betting exit code: \`${betting}\` (0=ok, 3=upstream, 6=storage)`,
              `- validate exit code: \`${validate}\` (4 = the serving tables are inconsistent)`,
              '',
              'See docs/runbook.md for triage.'
            ].join('\n');
            const alert = require('./.github/scripts/pipeline-alert.js');
            await alert({github, context}, {key: 'scrape', title, body});
